[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gradient-methods-nn-regression"
version = "0.1.0"
description = "Educational repository for gradient methods in nonlinear regression."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "matplotlib",
    "torch",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
